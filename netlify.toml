[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Old URLs keep working (links already shared on LinkedIn, resumes, etc.) ----
[[redirects]]
  from = "/assets/images/blog/Asif%20Edited%20Resume.pdf"
  to = "/resume/Asif-Mohamed-Mohideen-Resume.pdf"
  status = 301
[[redirects]]
  from = "/assets/images/blog/Asif Edited Resume.pdf"
  to = "/resume/Asif-Mohamed-Mohideen-Resume.pdf"
  status = 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# ---- Caching: fingerprinted files never change, so browsers keep them for a year ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/resume/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
# HTML is always re-checked so visitors see updates immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
